#   guzzoni.smoot.apple.com     -> DOMAIN-SUFFIX,smoot.apple.com  -> PROXY -> 节点 114.94.203.80:20010 (59.7 ms)
#   guzzoni.apple.com           -> DOMAIN,guzzoni.apple.com       -> PROXY -> 节点 (52.4 ms)
#   gateway.icloud.com          -> DOMAIN,gateway.icloud.com      -> PROXY -> 节点 (52.7–95.4 ms, 共 5 次)
#   api-siri-prod.apple.com     -> DOMAIN-KEYWORD,siri            -> PROXY -> 节点 (62.1 ms)
